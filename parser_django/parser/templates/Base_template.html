{% load static %}
{% load humanize %}


<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />

        <!-- Блок Title страницы >-->
        <title>{% block title %}{% endblock %}</title>

        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="{% static 'assets/favicon.ico' %}" />
        <!-- Bootstrap Icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css?family=Merriweather+Sans:400,700" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css?family=Merriweather:400,300,300italic,400italic,700,700italic" rel="stylesheet" type="text/css" />
        <!-- SimpleLightbox plugin CSS-->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/SimpleLightbox/2.1.0/simpleLightbox.min.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
        
    </head>
    <body id="page-top">
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-light fixed-top py-3" id="mainNav">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand" href="#page-top">Start Bootstrap</a>
                <button class="navbar-toggler navbar-toggler-right" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav ms-auto my-2 my-lg-0">
                        <li class="nav-item"><a class="nav-link" href="{% url 'parser:home' %}#about">О проекте</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'parser:home' %}#services">Услуги</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'parser:home' %}#portfolio">Портфолио</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'parser:home' %}#contact">Контакты</a></li>
                        <li class="nav-item">
                            <a class="btn btn-primary ms-3" href="{% url 'parser:form' %}">Форма поиска</a>  <!-- Выделенная кнопка -->
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        
        <!-- Содержание страницы -->
        {% block content %}{% endblock %}

        <!-- Народная мудрость -->
        <div>
            <blockquote class="blockquote text-center mt-4">
                <p class="mb-0 fst-italic">{{proverb}}</p>
                <footer class="blockquote-footer mt-2">Народная мудрость</footer>
            </blockquote>            
        </div>
        <!-- Кнопка "На главную" -->
        <div>
            <a href="{% url 'parser:home' %}" class="btn btn-outline-danger d-block mx-auto mt-3" style="width: fit-content;">На главную</a>
        </div>            
        
        <!-- Footer-->
        <footer class="bg-light py-5">
            <div class="container px-4 px-lg-5"><div class="small text-center text-muted">Copyright &copy; 2023 - Company Name</div></div>
        </footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- SimpleLightbox plugin JS-->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/SimpleLightbox/2.1.0/simpleLightbox.min.js"></script>
        <!-- Core theme JS-->
        <script src="{% static 'js/scripts.js' %}"></script>
        <!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *-->
        <!-- * *                               SB Forms JS                               * *-->
        <!-- * * Activate your form at https://startbootstrap.com/solution/contact-forms * *-->
        <!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *-->
        <script src="https://cdn.startbootstrap.com/sb-forms-latest.js"></script>

        {% block scripts %}{% endblock %}

    </body>
</html>
